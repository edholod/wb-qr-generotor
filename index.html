<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WB QR Generator</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font:20px system-ui,-apple-system,Arial,sans-serif}.wrap{max-width:540px;margin:auto;padding:32px 22px}h1{font-size:36px;line-height:1.12;margin:28px 0 18px}p{line-height:1.45}label{display:block;margin:28px 0 12px;font-weight:600}input{width:100%;padding:20px;border:2px solid #ccc;border-radius:14px;font-size:25px}button{display:block;width:100%;padding:19px;border-radius:14px;font-size:21px;font-weight:700;cursor:pointer;margin-top:16px;border:2px solid #111;background:#111;color:white}.secondary{background:white;color:#111}.muted{color:#666;font-size:15px}.result{display:none}#qr{background:white;border:2px solid #ddd;border-radius:14px;margin:24px auto;padding:15px;width:100%;max-width:340px;display:flex;justify-content:center}#qr canvas,#qr img{max-width:100%;height:auto}#error{color:#a00;font-size:16px;min-height:22px}footer{text-align:center;color:#777;font-size:14px;margin-top:60px}</style></head><body><main class="wrap"><section id="entry"><h1>Создать QR-код</h1><p>Введите номер ШК со стикера Wildberries.</p><label for="shk">Номер ШК</label><input id="shk" type="text" inputmode="numeric" autocomplete="off" placeholder="Введите цифры" maxlength="12"><p id="error"></p><button id="create">Создать QR-код</button></section><section id="result" class="result"><h1>Ваш QR-код готов</h1><div id="qr"></div><button id="save">Сохранить QR-код</button><button class="secondary" id="copy">Скопировать код</button><button class="secondary" id="again">Создать новый QR-код</button><p class="muted">Проверьте код перед использованием. Проверено по пяти контрольным примерам. Перед рабочим использованием проверьте сканером.</p></section><footer>Всё о WB ПВЗ by @edholod</footer></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
const permutation=[1,5,7,6,2,8,3,0,9,4];
function checkDigit(digits){let state=0;for(let offset=0;offset<digits.length;offset++){let digit=digits.charCodeAt(digits.length-1-offset)-48;for(let count=(offset+1)%8;count>0;count--)digit=permutation[digit];const left=state>=5,right=digit>=5;const turn=(state%5+(left?-(digit%5):digit%5)+5)%5;state=turn+(left!==right?5:0)}return state>=5?state:(5-state)%5}
function calculate(s){const split=Math.max(0,s.length-6);const check=(checkDigit(s.slice(0,split))<<4)|checkDigit(s.slice(split));let packed=(BigInt(s)<<8n)|BigInt(check);let out='';for(let i=0;i<8;i++){out=alphabet[Number(packed&63n)]+out;packed>>=6n}return '*'+out}
const tests=[['56334030277','*DR3FFcVz'],['59291021407','*Dc4FMF8A'],['56549093685','*DSqWsTWF'],['53264538105','*DGbQWfk2'],['55394512444','*DOXFLjxE']];
const testsPassed=tests.every(([s,expected])=>calculate(s)===expected);
let generated='';const $=id=>document.getElementById(id);$('create').onclick=()=>{let s=$('shk').value.trim();if(!/^[1-9][0-9]{0,11}$/.test(s)||BigInt(s)>=1099511627776n){$('error').textContent='Введите номер ШК без начальных нулей (1–12 цифр).';return}if(!testsPassed){$('error').textContent='Ошибка проверки алгоритма. Генерация отключена.';return}if(typeof QRCode==='undefined'){$('error').textContent='Не удалось загрузить библиотеку QR. Проверьте интернет.';return}generated=calculate(s);$('qr').innerHTML='';new QRCode($('qr'),{text:generated,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});$('entry').style.display='none';$('result').style.display='block'};$('again').onclick=()=>{$('result').style.display='none';$('entry').style.display='block';$('shk').value='';$('error').textContent='';$('shk').focus()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(generated);$('copy').textContent='Код скопирован'}catch(e){$('copy').textContent=generated}};$('save').onclick=()=>{const canvas=$('qr').querySelector('canvas');const img=$('qr').querySelector('img');const url=canvas?canvas.toDataURL('image/png'):img?.src;if(!url)return;const a=document.createElement('a');a.href=url;a.download='WB-QR.png';document.body.appendChild(a);a.click();a.remove()};
</script></body></html>
